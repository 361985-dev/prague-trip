<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c1621">
<meta name="color-scheme" content="light dark">
<title>פראג — תוכנית הטיול</title>
<style>
:root{
  --bg:#f6f1ea;--card:#fffdfa;--ink:#24191b;--muted:#6f6264;--line:#e6dccf;
  --accent:#7a1f2b;--accent-ink:#fff;--accent-soft:#f3e3e3;--gold:#a87b22;--gold-soft:#f5ead2;
  --ok:#2f6b47;--ok-soft:#e1efe5;--warn:#9a5b00;--warn-soft:#fbecd3;--info:#2d5374;--info-soft:#e0eaf3;
  --hero1:#5c1621;--hero2:#8a2a37;--shadow:0 1px 2px rgba(60,20,25,.06),0 4px 14px rgba(60,20,25,.06);
  --r:16px;--tap:44px;
  --sans:system-ui,-apple-system,"Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --serif:"Frank Ruehl CLM","David","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#131012;--card:#1d181b;--ink:#f1e9e2;--muted:#a99d9b;--line:#33292d;
  --accent:#e0808c;--accent-ink:#1a0d10;--accent-soft:#3a1d23;--gold:#dcb764;--gold-soft:#3a3020;
  --ok:#7cc79a;--ok-soft:#1d3326;--warn:#f0b35c;--warn-soft:#3b2c14;--info:#8fb8de;--info-soft:#1c2a38;
  --hero1:#2a0b11;--hero2:#4a1520;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
  --bg:#131012;--card:#1d181b;--ink:#f1e9e2;--muted:#a99d9b;--line:#33292d;
  --accent:#e0808c;--accent-ink:#1a0d10;--accent-soft:#3a1d23;--gold:#dcb764;--gold-soft:#3a3020;
  --ok:#7cc79a;--ok-soft:#1d3326;--warn:#f0b35c;--warn-soft:#3b2c14;--info:#8fb8de;--info-soft:#1c2a38;
  --hero1:#2a0b11;--hero2:#4a1520;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--hero1);color:#fbefd9;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top .row{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 20px/1.15 var(--serif);color:#f0cf7f;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .dates{font-size:12.5px;opacity:.85}
.ibtn{width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;border:0;background:rgba(255,255,255,.08);border-radius:12px;color:#fbefd9;cursor:pointer}
.ibtn:active{background:rgba(255,255,255,.2)}
.ibtn[aria-pressed=true]{background:#f0cf7f;color:#3a0c14}
.searchbar{display:none;padding:0 0 10px}
.top.searching .searchbar{display:block}
.searchbar input{width:100%;height:46px;border-radius:12px;border:1px solid rgba(240,207,127,.4);background:rgba(0,0,0,.25);color:#fff;padding:0 14px;font:inherit;outline:none}
.searchbar input::placeholder{color:rgba(251,239,217,.6)}
.searchbar input:focus{border-color:#f0cf7f}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,var(--hero1),var(--hero2));color:#fbefd9;position:relative;overflow:hidden}
.hero .wrap{padding-top:6px;padding-bottom:58px;position:relative;z-index:1}
.skyline{position:absolute;inset:auto 0 0 0;height:64px;width:100%;color:#f0cf7f;opacity:.28}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#8fd6a6}
.badge.off .dot{background:#f0b35c}
.status{font-size:15px;margin:0 0 12px}
.status b{color:#f0cf7f}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:14px;background:#f0cf7f;color:#3a0c14;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #b48f3c}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #b48f3c}
.sample{margin:10px 0 0;font-size:12.5px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px}

/* ---------- views ---------- */
main{margin-top:-40px;position:relative;z-index:2}
.view{display:none}
.view.on{display:block}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.vh h2{margin:0;font:700 22px/1.2 var(--serif);color:var(--ink)}
.vh .sub{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.card.pad{padding:14px}
.card h3{margin:0 0 4px;font-size:17px;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* day */
details.day>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:64px}
details.day>summary::-webkit-details-marker{display:none}
.dnum{flex:none;width:48px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;text-align:center;line-height:1}
.dnum b{font:700 21px/1 var(--serif);display:block}
.dnum span{font-size:11px}
.day.is-today .dnum{background:var(--accent);color:var(--accent-ink)}
.dtitle{flex:1;min-width:0}
.dtitle h3{margin:0}
.dtitle .muted{font-size:13px}
.chev{transition:transform .2s;color:var(--muted)}
details[open]>summary .chev{transform:rotate(180deg)}
.tl{list-style:none;margin:0;padding:0 14px 8px}
.it{position:relative;display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0 12px;border-top:1px dashed var(--line)}
.it .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--gold);padding-top:1px;text-align:center}
.it .t small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.it h4{margin:0;font-size:16px;line-height:1.35}
.it p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.it.done h4{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.65}
.it.now{background:linear-gradient(90deg,transparent,var(--gold-soft) 30%);margin:0 -14px;padding-inline:14px;border-radius:0}
.it.now .t{color:var(--accent)}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:2px}
.flag.now{background:var(--accent);color:var(--accent-ink)}
.flag.next{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}

/* place */
.pl{padding:14px}
.pl .hd{display:flex;gap:10px;align-items:flex-start}
.pl .hd>div{flex:1;min-width:0}
.pl .en{font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;gap:4px;align-items:center}
.why{margin:8px 0 0;font-size:14.5px}
.pl.done{opacity:.72}
.src{margin-top:8px;font-size:12.5px}
.src a{margin-inline-end:10px}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.t-red{background:var(--accent-soft);color:var(--accent)}
.tag.t-gold{background:var(--gold-soft);color:var(--gold)}
.tag.t-ok{background:var(--ok-soft);color:var(--ok)}
.tag.t-warn{background:var(--warn-soft);color:var(--warn)}
.tag.t-info{background:var(--info-soft);color:var(--info)}
.tag.t-pride{background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}

/* actions */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.act.book{background:#c9a227;border-color:#c9a227;color:#1d1406;font-weight:700}
.act.chk[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.act svg.i{width:18px;height:18px}
.it .acts{gap:5px}.it .act{padding:0 10px;min-width:42px}
.addr{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}

/* practical */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin:8px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.sos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sos a,.sos div{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:64px}
.sos b{display:block;font:700 24px/1.1 var(--sans);color:var(--accent)}
.sos b.long{font-size:16px;padding-top:4px}
.sos span{font-size:13px;color:var(--muted)}
.phr{width:100%;border-collapse:collapse;font-size:14.5px}
.phr td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.phr tr:first-child td{border-top:0}
.phr .cs{font-weight:600}
.phr .tr{color:var(--gold);font-size:13.5px}
.conv{display:flex;gap:8px;align-items:center;margin-top:8px}
.conv input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:17px}
.conv output{flex:1;font-weight:700;font-size:17px}
.tip{border-inline-start:4px solid var(--gold)}
.tip h3{display:flex;gap:8px;align-items:center}
ol.steps{margin:6px 0 0;padding-inline-start:20px;font-size:14.5px}
ol.steps li{margin:3px 0}

/* search results */
.res-group{margin:6px 2px 4px;font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
mark{background:var(--gold-soft);color:inherit;border-radius:3px}

/* bottom tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:11.5px;position:relative}
.tab .em{font-size:21px;line-height:1.1;filter:grayscale(.6);opacity:.8}
.tab[aria-selected=true]{color:var(--accent);font-weight:700}
.tab[aria-selected=true] .em{filter:none;opacity:1}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,4,6,.55);align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:var(--card);color:var(--ink);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;font:700 20px/1.25 var(--serif)}
.sheet .close{width:100%;margin-top:14px}
.taxi{text-align:center}
.taxi .cz{font-size:15px;color:var(--muted);margin:0 0 10px}
.taxi .big{font-size:28px;font-weight:800;line-height:1.3;margin:6px 0;word-break:break-word}
.taxi .nm{font-size:18px;color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#24191b;color:#fbefd9;padding:10px 16px;border-radius:12px;font-size:14px;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* static snapshot mode (saved file opened without JS, e.g. iOS Files preview) */
html.snap .view{display:block!important}
html.snap .tabs,html.snap .ibtn,html.snap .cta,html.snap .act.chk,html.snap .act.js{display:none!important}
html.snap details.day>.tl{display:block}
html.snap #results{display:none!important}
@media print{.tabs,.top,.cta,.acts{display:none!important}.view{display:block!important}}
</style>

<header class="top" id="top">

    </div>
    <div class="searchbar"><input id="q" type="search" inputmode="search" placeholder="חיפוש: מקום, אזור, תגית…" aria-label="חיפוש" autocomplete="off"></div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="badges">
      <span class="badge" id="b-net"><span class="dot"></span><span>מחובר</span></span>
      <span class="badge" id="b-cache" hidden>✓ שמור במכשיר</span>
      <span class="badge" id="b-ver"></span>
    </div>
    <p class="status" id="status"></p>
    <button class="cta" id="b-save" data-savehelp>📴 איך לשמור לאופליין</button>
    <p class="sample" id="sample" hidden>⚠️ נתוני דוגמה — התוכן הסופי יוחלף</p>
  </div>
  <svg class="skyline" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 64V50h18v-6h8v6h10V40l6-8 6 8v10h12V46h10v-8h4v-6l3-10 3 10v6h4v8h8v4h6V36h4l2-12 2 12h4v14h10v-6h22V30h4V18l4-6 4 6v12h4V22l2-4 2 4v8h6v14h8V34h3l3-14 3 14h3v16h16V42h6v-6h12v6h10V28h4l3-10 3 10h4v22h8v-4c0-6 5-10 10-10s10 4 10 10v4h8V38h4l4-16 4 16h4v12h18V44h10v6h22v-8h6v8h18v14z"/><path fill="currentColor" opacity=".7" d="M0 64c40-10 80-10 120 0s80 10 120 0 80-10 120 0h40v0H0z"/></svg>
</section>

<main class="wrap" id="views">
  <section class="view" id="v-schedule" data-tab="schedule"></section>
  <section class="view" id="v-food" data-tab="food"></section>
  <section class="view" id="v-sights" data-tab="sights"></section>
  <section class="view" id="v-night" data-tab="night"></section>
  <section class="view" id="v-shopping" data-tab="shopping"></section>
  <section class="view" id="v-practical" data-tab="practical"></section>
  <section class="view" id="results"></section>
</main>

<nav class="tabs" role="tablist" aria-label="ניווט">
  <div class="wrap">
    <button class="tab" role="tab" data-go="schedule"><span class="em">🗓️</span>לו״ז</button>
    <button class="tab" role="tab" data-go="food"><span class="em">🍽️</span>אוכל</button>
    <button class="tab" role="tab" data-go="sights"><span class="em">🏰</span>אטרקציות</button>
    <button class="tab" role="tab" data-go="night"><span class="em">🏳️‍🌈</span>לילה</button>
    <button class="tab" role="tab" data-go="shopping"><span class="em">🛍️</span>שופינג</button>
    <button class="tab" role="tab" data-go="practical"><span class="em">🧭</span>מעשי</button>
  </div>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="box" id="sheet-box"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="app">
(function(){

/* ---------- data ---------- */

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var IC={
 pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
 car:'<path d="M5 16V11l2-5h10l2 5v5M5 16h14M5 16v2m14-2v2M3 11h18"/><circle cx="8" cy="13.5" r=".6"/><circle cx="16" cy="13.5" r=".6"/>',
 phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/>',
 check:'<path d="m5 12 5 5L20 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M9 9.5h4.5a2 2 0 0 1 0 4H10a2 2 0 0 0 0 4h5M12 6v2m0 9v1"/>',
 chev:'<path d="m6 9 6 6 6-6"/>',
 link:'<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>'
};

 reserve:['צריך הזמנה','t-red'], bookAhead:['להזמין מראש','t-red'], cash:['מזומן בלבד','t-warn'],
 walkin:['בלי הזמנה','t-ok'], free:['חינם','t-ok'], mustSee:['חובה ⭐','t-gold'], gay:['🏳️‍🌈 גאה','t-pride'],

function mapsUrl(p){if(p.mapsUrl)return p.mapsUrl;var q=[p.name,p.address].filter(Boolean).join(', ');return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):''}
function telHref(n){return 'tel:'+String(n).replace(/[^\d+]/g,'')}
function dateParts(iso){var p=String(iso).split('-');return {y:+p[0],m:+p[1],d:+p[2]}}

function dm(iso){var p=dateParts(iso);return p.d+'.'+p.m}
function hm(dt){var m=/T(\d\d:\d\d)/.exec(dt||'');return m?m[1]:''}
function dOf(dt){return String(dt||'').slice(0,10)}
function fdt(dt){var d=dOf(dt),t=hm(dt);if(!/^\d{4}-\d\d-\d\d$/.test(d))return '<span class="muted">טרם נקבע</span>';return esc(dayName(d)+' '+dm(d))+' · '+(t?'<span class="ltr">'+esc(t)+'</span>':'<span class="muted">שעה טרם נקבעה</span>')}
function toMin(t){var m=/^(\d{1,2}):(\d\d)/.exec(t||'');return m?(+m[1])*60+(+m[2]):null}

/* Prague "now" (override for testing: window.__NOW__='2026-11-09T13:05') */
function pragueNow(){
  var o=window.__NOW__||M.debugNow;

    var g={};f.forEach(function(x){g[x.type]=x.value});return {date:g.year+'-'+g.month+'-'+g.day,min:(+g.hour%24)*60+(+g.minute)}}
  catch(e){var d=new Date();return {date:d.toISOString().slice(0,10),min:d.getHours()*60+d.getMinutes()}}
}
function daysBetween(a,b){var x=dateParts(a),y=dateParts(b);return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5)}

/* ---------- action buttons ---------- */
function actions(p,id,opts){

    h+='<button class="act js" data-taxi="'+esc(p.id||'')+'" data-addr="'+esc(p.address)+'" data-name="'+esc(p.name||'')+'">'+ic('car')+'לנהג</button>'}
  if(p.phone)h+='<a class="act" href="'+esc(telHref(p.phone))+'" aria-label="טלפון">'+ic('phone')+(c?'':'<span class="ltr">'+esc(p.phone)+'</span>')+'</a>';
  if(id)h+='<button class="act chk" data-chk="'+esc(id)+'" aria-pressed="'+(S.checked[id]?'true':'false')+'" aria-label="'+(opts.chkLabel||'ביקרנו')+'">'+ic('check')+(c?'':(opts.chkLabel||'ביקרנו'))+'</button>';
  return '<div class="acts">'+h+'</div>';
}
function addrLine(p){return p.address?'<span class="addr" dir="ltr" style="text-align:right">'+esc(p.address)+'</span>':''}

/* ---------- schedule ---------- */
function itemPlace(it){var p=it.placeId&&PLACES[it.placeId];return Object.assign({},p||{},{name:(p&&p.name)||it.title,address:it.address||(p&&p.address),mapsUrl:it.mapsUrl||(p&&p.mapsUrl),phone:it.phone||(p&&p.phone)})}
function itemId(day,i,it){return it.id||(day.date+'-'+i)}
function renderItem(day,it,i){
  var id=itemId(day,i,it),p=itemPlace(it),hasLoc=!!(it.placeId||it.address||it.mapsUrl);
  var tags=(it.tags||[]).slice();
  return '<li class="it'+(S.checked[id]?' done':'')+'" data-item="'+esc(id)+'" data-min="'+(toMin(it.time)==null?'':toMin(it.time))+'">'+
   '<div class="t ltr">'+esc(it.time||'—')+(it.endTime?'<small>'+esc(it.endTime)+'</small>':'')+'</div>'+
   '<div><h4>'+esc(it.title)+'<span class="nowflag"></span></h4>'+
   (p.nameHe&&p.name&&it.placeId?'<p class="ltr" style="text-align:right">'+esc(p.name)+(p.area?' · '+esc(p.area):'')+'</p>':'')+
   (it.note?'<p>'+esc(it.note)+'</p>':'')+tagsHtml(tags)+
   (hasLoc?actions(p,id,{chkLabel:'בוצע',compact:1}):'<div class="acts"><button class="act chk" data-chk="'+esc(id)+'" aria-pressed="'+(S.checked[id]?'true':'false')+'">'+ic('check')+'בוצע</button></div>')+
   '</div></li>';

function renderSchedule(){
  var days=D.days||[],now=pragueNow();
  var h='<div class="vh"><h2>לו״ז יומי</h2><span class="sub">'+days.length+' ימים</span></div><div class="chips" role="toolbar">';
  days.forEach(function(d,i){h+='<button class="chip'+(d.date===now.date?' today':'')+'" data-jump="day-'+i+'">'+esc(dayName(d.date))+' '+esc(dm(d.date))+'</button>'});
  h+='</div>';
  days.forEach(function(d,i){
    var today=d.date===now.date,past=d.date<now.date;
    h+='<details class="card day'+(today?' is-today':'')+'" id="day-'+i+'" data-date="'+esc(d.date)+'"'+(past?'':' open')+'><summary>'+
      '<div class="dnum"><div><b>'+dateParts(d.date).d+'</b><span>'+esc(dayName(d.date))+'</span></div></div>'+
      '<div class="dtitle"><h3>יום '+(i+1)+' · '+esc(d.title||'')+'</h3><div class="muted">'+esc(d.summary||'')+'</div></div>'+
      '<span class="chev">'+ic('chev')+'</span></summary><ol class="tl">'+
      (d.items||[]).map(function(it,j){return renderItem(d,it,j)}).join('')+'</ol></details>';
  });
  if(!days.length)h+='<div class="empty">אין עדיין לו״ז</div>';

}
function markNow(){
  var now=pragueNow();
  $$('.it.now').forEach(function(e){e.classList.remove('now')});
  $$('.nowflag').forEach(function(e){e.innerHTML=''});
  var day=$('details.day[data-date="'+now.date+'"]');
  if(!day)return null;
  var items=$$('.it',day).filter(function(e){return e.dataset.min!==''});
  var cur=null,next=null;
  items.forEach(function(e){var m=+e.dataset.min;if(m<=now.min)cur=e;else if(!next)next=e});
  if(cur&&next&&now.min-(+cur.dataset.min)>240)cur=null; /* stale */
  if(cur){cur.classList.add('now');$('.nowflag',cur).innerHTML='<span class="flag now">עכשיו</span>'}
  if(next){$('.nowflag',next).innerHTML='<span class="flag next">הבא</span>'}
  return cur||next;
}

/* ---------- places ---------- */
var SUBF={};
function renderPlace(p,q){
  var id='p:'+p.id,hl=function(s){return q?esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):esc(s)};
  return '<article class="card pl'+(S.checked[id]?' done':'')+'" data-place="'+esc(p.id)+'"><div class="hd"><div>'+
    '<h3>'+hl(p.nameHe||p.name)+'</h3>'+(p.nameHe&&p.name?'<div class="en ltr" style="text-align:right">'+hl(p.name)+'</div>':'')+

var CAT={food:['אוכל','מסעדות, בתי קפה ובירה'],sights:['אטרקציות','מה לראות'],night:['לילה 🏳️‍🌈','ברים ומועדונים'],shopping:['שופינג','חנויות ושווקים']};
function renderCat(cat){
  var all=(D.places||[]).filter(function(p){return p.category===cat});

  if(cat==='night'&&D.nightIntro)h+='<div class="card pad tip small">'+esc(D.nightIntro)+'</div>';
  h+=list.map(function(p){return renderPlace(p)}).join('')||'<div class="empty">אין עדיין מקומות</div>';

/* ---------- practical ---------- */
function renderPractical(){
  var P=D.practical||{},h='<div class="vh"><h2>מעשי</h2></div>';
  /* emergency */
  if(P.emergency&&P.emergency.length){h+='<div class="card pad"><h3>🚨 חירום</h3><div class="sos" style="margin-top:8px">'+

  /* flights */
  (D.flights||[]).forEach(function(f){
    h+='<div class="card pad"><h3>'+(f.direction==='back'?'🛬 טיסה חזרה':'🛫 טיסה הלוך')+'</h3><dl class="kv">'+

/* ---------- search ---------- */

    if(norm([it.title,it.note,p.name,p.nameHe,p.area,tagText(it.tags)].join(' ')).indexOf(nq)>=0)its.push({d:d,i:i,it:it,j:j})})});
  var h='<div class="vh"><h2>תוצאות</h2><span class="sub">'+(pl.length+its.length)+'</span></div>';
  if(its.length){h+='<div class="res-group">בלו״ז</div><div class="card"><ol class="tl">'+its.map(function(x){
    return renderItem(x.d,Object.assign({},x.it,{note:'יום '+(x.i+1)+' · '+dm(x.d.date)+(x.it.note?' — '+x.it.note:'')}),x.j)}).join('')+'</ol></div>'}
  if(pl.length){h+='<div class="res-group">מקומות</div>'+pl.map(function(p){return renderPlace(p,q)}).join('')}
  if(!pl.length&&!its.length)h+='<div class="empty">לא נמצא דבר עבור "'+esc(q)+'"</div>';
  r.innerHTML=h;
}

/* ---------- navigation ---------- */
var TABS=['schedule','food','sights','night','shopping','practical'];
function show(tab,noScroll){
  if(TABS.indexOf(tab)<0)tab='schedule';
  S.tab=tab;save();
  var q=$('#q').value.trim();
  $$('.view').forEach(function(v){v.classList.toggle('on',q?v.id==='results':v.dataset.tab===tab)});
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(!q&&b.dataset.go===tab))});
  if(location.hash.slice(1)!==tab){try{history.replaceState(null,'','#'+tab)}catch(e){}}
  if(!noScroll)window.scrollTo({top:$('main').offsetTop-70,behavior:'auto'});
}
function renderAll(){renderSchedule();['food','sights','night','shopping'].forEach(renderCat);renderPractical()}

/* ---------- header / status ---------- */
function renderHeader(){
  $('#t-title').textContent=M.title||'פראג';
  document.title=(M.title||'פראג')+' — תוכנית הטיול';
  var s=M.startDate,e=M.endDate;
  $('#t-dates').textContent=s?(dayName(s)+' '+dm(s)+' – '+dayName(e)+' '+dm(e)):'';
  $('#b-ver').textContent='עודכן '+(M.updatedAt?dm(M.updatedAt):'');
  $('#sample').hidden=!M.sample;
  var now=pragueNow(),st=$('#status');
  var sub=M.subtitle?'<br><span style="opacity:.8;font-size:13.5px">'+esc(M.subtitle)+'</span>':'';
  if(s&&now.date<s){var n=daysBetween(now.date,s);st.innerHTML=(n===1?'<b>מחר</b> טסים לפראג ✈️':'עוד <b>'+n+'</b> ימים לפראג ✈️')+sub}
  else if(e&&now.date>e){st.innerHTML='הטיול הסתיים — מקווים שנהניתם 🍻'+sub}
  else if(s){var i=daysBetween(s,now.date)+1;var d=(D.days||[]).filter(function(x){return x.date===now.date})[0];
    st.innerHTML='יום <b>'+i+'</b> בפראג'+(d&&d.title?' · '+esc(d.title):'')+' · <span class="ltr">'+String(Math.floor(now.min/60)).padStart(2,'0')+':'+String(now.min%60).padStart(2,'0')+'</span> שעון פראג'}
}
function netBadge(){var on=navigator.onLine!==false,b=$('#b-net');b.classList.toggle('off',!on);b.lastElementChild.textContent=on?'מחובר':'אופליין — הכל זמין'}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}

/* ---------- sheet / toast ---------- */
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}
function openSheet(html){$('#sheet-box').innerHTML=html+'<button class="cta close" data-close>סגירה</button>';$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function taxiSheet(name,addr){
  openSheet('<div class="taxi"><p class="cz ltr">Dobrý den, prosím, odvezte mě na tuto adresu:</p><div class="nm ltr">'+esc(name)+'</div><div class="big ltr">'+esc(addr)+'</div>'+
    '<p class="small muted">"שלום, בבקשה קח אותי לכתובת הזו" — הראו את המסך לנהג</p>'+
    '<div class="acts" style="justify-content:center"><button class="act js" data-copy="'+esc(addr)+'">'+ic('copy')+'העתק</button><a class="act primary" target="_blank" rel="noopener" href="'+esc(mapsUrl({name:name,address:addr}))+'">'+ic('pin')+'מפה</a></div></div>');
}
function offlineHtml(){return '<ol class="steps">'+
   '<li><b>להשאיר את הלשונית פתוחה.</b> הדף כולו (טקסט, מפות-קישורים, תמונות) נטען בפעם אחת ועובד בלי רשת — רק לא לרענן ולא לסגור.</li>'+
   '<li><b>קובץ HTML בוואטסאפ.</b> נשלח גם כקובץ — הורידו אותו ופתחו מוואטסאפ או מאפליקציית <b>קבצים</b>/<b>הורדות</b>; עובד בלי אינטרנט.</li>'+
   '<li><b>iPhone:</b> בספארי ← שיתוף ⬆️ ← <b>הוספה למסך הבית</b> לגישה מהירה (לבד זה לא מבטיח עבודה בלי רשת — לכן גם הקובץ).</li>'+
   '<li><b>Google Maps אופליין:</b> להוריד את פראג מראש (פרטים בטאב <a href="#practical" data-go="practical">מעשי</a>) — כפתורי "מפה" ינווטו גם בלי רשת.</li></ol>'+
   '<p class="small muted" style="margin:8px 0 0">סימוני "ביקרנו/בוצע" נשמרים בכל טלפון בנפרד.</p>'}
function saveHelp(){openSheet('<h3>📴 איך לשמור לאופליין</h3>'+offlineHtml())}
function snapshotHtml(){
  var c=document.documentElement.cloneNode(true);
  c.classList.add('snap');c.removeAttribute('data-theme');
  $$('script',c).forEach(function(s){if(s.id!=='plan-data'&&s.id!=='app')s.parentNode.removeChild(s)});
  $$('iframe,link[rel=preload]',c).forEach(function(n){n.parentNode.removeChild(n)});
  $$('details',c).forEach(function(d){d.setAttribute('open','')});
  var r=c.querySelector('#results');if(r)r.innerHTML='';
  var sh=c.querySelector('#sheet');if(sh)sh.className='sheet';
  var q=c.querySelector('#q');if(q)q.removeAttribute('value');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
/* ---------- events ---------- */
function copyText(t){
  var ok=function(){toast('הועתק ✓')};
  var legacy=function(){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var r=document.execCommand('copy');ta.remove();if(r)ok();else taxiSheet('',t)}catch(e){taxiSheet('',t)}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,legacy);return}}catch(e){}
  legacy();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-copy],[data-taxi],[data-chk],[data-jump],[data-sub],[data-close],[data-savehelp]');
  if(!el){if(e.target.id==='sheet')closeSheet();return}
  if(el.dataset.go){e.preventDefault();closeSheet();$('#q').value='';show(el.dataset.go);return}
  if(el.hasAttribute('data-copy')){copyText(el.getAttribute('data-copy'));return}
  if(el.hasAttribute('data-taxi')){taxiSheet(el.dataset.name,el.dataset.addr);return}
  if(el.hasAttribute('data-close')){closeSheet();return}
  if(el.hasAttribute('data-savehelp')){e.preventDefault();saveHelp();return}
  if(el.dataset.chk){var id=el.dataset.chk,v=!S.checked[id];if(v)S.checked[id]=1;else delete S.checked[id];save();
    $$('[data-chk="'+id.replace(/"/g,'\\"')+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(v));var row=b.closest('.it,.pl');if(row)row.classList.toggle('done',v)});
    if(v)toast('סומן ✓');return}
  if(el.dataset.jump){var d=document.getElementById(el.dataset.jump);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(el.hasAttribute('data-sub')){SUBF[el.dataset.cat]=el.dataset.sub;renderCat(el.dataset.cat);return}
});
$('#b-theme').addEventListener('click',function(){
  var dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme=dark?'light':'dark';applyTheme();save();
});
$('#b-search').addEventListener('click',function(){
  var t=$('#top'),on=!t.classList.contains('searching');t.classList.toggle('searching',on);this.setAttribute('aria-pressed',String(on));
  if(on)$('#q').focus();else{$('#q').value='';show(S.tab,true)}
});
var qt;$('#q').addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(function(){var q=$('#q').value.trim();if(q)renderSearch(q);show(S.tab,true)},120)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
window.addEventListener('online',netBadge);window.addEventListener('offline',netBadge);
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.indexOf(h)>=0&&h!==S.tab)show(h)});

/* ---------- boot ---------- */
applyTheme();renderHeader();renderAll();netBadge();
var h0=location.hash.slice(1);show(TABS.indexOf(h0)>=0?h0:S.tab,true);
if(save()&&cachePlan())$('#b-cache').hidden=false;
/* on trip days, open schedule at the current item */
(function(){var now=pragueNow();if(M.startDate&&now.date>=M.startDate&&now.date<=M.endDate&&!h0){show('schedule',true);var t=$('.it.now')||$('.flag.next');if(t)setTimeout(function(){(t.closest?t.closest('.it'):t).scrollIntoView({block:'center'})},200)}})();
setInterval(function(){markNow();renderHeader()},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){markNow();renderHeader()}});
window.__plan={data:D,state:S,rerender:function(){renderHeader();renderAll();show(S.tab,true)},snapshot:snapshotHtml};
})();
</script>
